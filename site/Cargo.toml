[package]
name = "malevich-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The static site generator behind shergin.github.io/malevich"
license = "MIT OR Apache-2.0"

[[bin]]
name = "site"
path = "src/main.rs"

[dependencies]
malevich = { path = "..", features = ["pixel", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
