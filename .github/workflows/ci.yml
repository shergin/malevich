name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --all-features --all-targets
      - run: cargo test --doc
      - run: cargo run --example regen_docs -- --check
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The published CLI crate (`kaz`) is a workspace member kept out of the default
  # set, so every job above builds the library alone. This job is its own gate —
  # additive, so core CI stays exactly as it was.
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p malevich-cli --check
      - run: cargo clippy -p malevich-cli --all-targets -- -D warnings
      - run: cargo test -p malevich-cli

  # Demos are workspace members but intentionally not default members. Keep
  # their data shaping and ratatui integration under an explicit gate instead
  # of relying on a developer to remember `--workspace` locally.
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p fred -p sysmon --all-targets -- -D warnings
      - run: cargo test -p fred -p sysmon --all-targets

  # Exercise the non-Unix pixel/detection fallbacks and the CLI's cfg-gated live
  # path on a native Windows toolchain. Generated docs stay on the Unix matrix so
  # newline-sensitive fixtures have one canonical producer.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features --all-targets
      - run: cargo test -p malevich-cli

  # Allocation counts are structural and deterministic enough to gate when both
  # the OS image and compiler are pinned. Wall-clock Criterion results are recorded,
  # not gated, because shared-runner timing is noisy.
  allocation-budget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo bench --bench alloc -- --check

  # The declared MSRV actually builds. Library + optional features only — dev-deps
  # (criterion, ratatui) are free to require newer toolchains.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --lib --all-features

  # Dependency advisories, licenses, and sources (see deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Catch accidental breaking API changes: the crate's public surface is compared
  # against the last published release. A break requires a major version bump.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features
