name: parser fuzz

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  terminal-replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p target && rustc --edition=2024 -D warnings -O fuzz/probe_parser.rs -o target/probe-parser-fuzz
      - run: target/probe-parser-fuzz 250000 ${{ github.run_id }}
