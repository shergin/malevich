[package]
name = "malevich-rim"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/shergin/malevich"
description = "Request decoding shared by the malevich language rims (wasm, Python): Document + columns, presets by name, packed rasters"

[dependencies]
malevich = { path = "..", features = ["serde", "pixel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
